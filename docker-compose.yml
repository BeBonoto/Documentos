# Ambiente local completo: Postgres+pgvector, Evolution API e o bot.
# Uso: cp .env.example .env  (preencha OPENAI_API_KEY)  &&  docker compose up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: docs
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro # cria o banco da Evolution
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d docs"]
      interval: 5s
      retries: 10

  evolution:
    image: atendai/evolution-api:v2.2.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://app:app@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      # Webhook global: todas as instâncias enviam mensagens para o bot.
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://app:3000/webhook/evolution?token=${WEBHOOK_TOKEN}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "8080:8080"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/docs
      EVOLUTION_API_URL: http://evolution:8080
      # A Evolution baixa os arquivos a enviar por esta URL (rede interna do compose).
      PUBLIC_BASE_URL: http://app:3000
      LOCAL_STORAGE_DIR: /app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      evolution:
        condition: service_started
    volumes:
      - uploads:/app/data
    ports:
      - "3000:3000"

volumes:
  pgdata:
  evolution_instances:
  uploads:
